# nginx.conf
events {
    worker_connections 1024;
}
http {
    server {
        listen 80;
        server_name hornas.ru, www.hornas.ru; # Ваш домен или IP

        location / {
            # Перенаправляем все запросы к контейнеру с Java
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}