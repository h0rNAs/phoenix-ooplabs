  <line x1="256" y1="192" x2="256" y2="400" stroke="#ffa500" stroke-width="32" stroke-linecap="round"></line>

  <line x1="304" y1="192" x2="304" y2="400" stroke="#ffa500" stroke-width="32" stroke-linecap="round"></line>
