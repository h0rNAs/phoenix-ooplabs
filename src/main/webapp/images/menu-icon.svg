<!-- e_pow_x-icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="e to the power x icon">
  <title>e^x Icon</title>

  <!-- Большая буква e -->
  <text x="160" y="320" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="260" fill="#ffa500" text-rendering="geometricPrecision">
    e
  </text>

  <!-- Степень (superscript) -->
  <text x="340" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="110" fill="#ffa500" text-rendering="geometricPrecision">
    x
  </text>
</svg>
