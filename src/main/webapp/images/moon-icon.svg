<!-- darktheme-icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Orange crescent moon">
  <title>Orange crescent moon</title>
  <defs>
    <!-- Маска: белым показывается, чёрным вырезается -->
    <mask id="crescent-mask">
      <rect width="100%" height="100%" fill="white"></rect>
      <!-- Этот круг вырезает часть большого круга, создавая серп -->
      <circle cx="330" cy="170" r="150" fill="black"></circle>
    </mask>
  </defs>

  <!-- Большой круг (луна) с применённой маской чтобы получился серп -->
  <circle cx="256" cy="256" r="180" fill="#ffa500" mask="url(#crescent-mask)"></circle>
</svg>
